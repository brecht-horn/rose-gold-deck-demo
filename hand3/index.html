<style>

const MAJORS = [
  ['0', 'The Fool'], ['I', 'The Magician'], ['II', 'The High Priestess'], ['III', 'The Empress'],
  ['IV', 'The Emperor'], ['V', 'The Hierophant'], ['VI', 'The Lovers'], ['VII', 'The Chariot'],

/* =====================================================================
   The thumb rule (locked). Method T birth card + name number, counted
   through the 22 Majors.
   ===================================================================== */
const digitsOf = n => String(n).split('').map(Number);
function birthCard(y, m, d) {
  const C = y >= 2000 ? 20 : 19;              // 19 for 1900-1999, 20 for 2000-2099
  const YY = y % 100;
  const S = m + d + C + YY;
  const steps = [`${m} + ${d} + ${C} + ${YY} = ${S}`];
  let v = S;
  if (v >= 100) {                              // three digits: first two (as one number) + last digit
    const a = Math.floor(v / 10), b = v % 10;
    v = a + b; steps.push(`${a} + ${b} = ${v}`);
  }
  while (v > 21) {                             // still above 21: digit sum, repeated
    const ds = digitsOf(v);
    v = ds.reduce((s, x) => s + x, 0); steps.push(`${ds.join(' + ')} = ${v}`);
  }
  if (v >= 1 && v <= 9) { steps.push(`${v} + 9 = ${v + 9}`); v += 9; }   // single digit: its partner
  return { S, card: v, steps };

function nameNumber(raw) {
  const first = String(raw || '').trim();       // the whole field counts; nothing is split at spaces
  const letters = first.normalize('NFD').replace(/\p{M}/gu, '').toLowerCase().replace(/[^a-z]/g, '');
  let sum = 0;
  for (const ch of letters) sum += ch.charCodeAt(0) - 96;

  const birth = date ? birthCard(date.y, date.m, date.d) : null;
  const start = birth ? birth.card : 0;        // no birthday: start from The Fool
  const n = nameNumber(name);
  const thumb = n.letters ? (start + n.sum) % 22 : start;
  return { birth, start, name: n, thumb };
}

  uniform vec4 uOcc;      // planet centre (view space) + radius
